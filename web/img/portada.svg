<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00502B"/>
      <stop offset="1" stop-color="#002313"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#ffffff" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <!-- costa -->
  <path d="M1600 120 C1450 220 1380 330 1300 470 S1150 760 980 1000 L1600 1000 Z" fill="#001A0E" opacity=".55"/>
  <!-- rutas -->
  <g fill="none" stroke-linecap="round">
    <path d="M1180 260 C1020 330 900 420 760 470 S480 560 260 700" stroke="#FFD940" stroke-width="4" stroke-dasharray="2 16" opacity=".85"/>
    <path d="M1180 260 C1100 420 1040 560 960 650 S820 820 700 920" stroke="#ffffff" stroke-width="3" stroke-dasharray="2 14" opacity=".35"/>
    <path d="M1180 260 C1260 380 1300 520 1320 700" stroke="#ffffff" stroke-width="3" stroke-dasharray="2 14" opacity=".3"/>
  </g>
  <!-- puntos -->
  <g>
    <circle cx="1180" cy="260" r="18" fill="#FFD940"/>
    <circle cx="1180" cy="260" r="36" fill="none" stroke="#FFD940" stroke-opacity=".4" stroke-width="2"/>
    <circle cx="260" cy="700" r="12" fill="#ffffff" opacity=".9"/>
    <circle cx="700" cy="920" r="10" fill="#ffffff" opacity=".6"/>
    <circle cx="1320" cy="700" r="10" fill="#ffffff" opacity=".6"/>
  </g>
  <!-- burbujas de mensaje -->
  <g opacity=".22" fill="#ffffff">
    <rect x="1240" y="380" width="230" height="64" rx="18"/>
    <rect x="1290" y="470" width="180" height="56" rx="18"/>
    <rect x="1220" y="552" width="250" height="64" rx="18" fill="#FFD940"/>
  </g>
</svg>
